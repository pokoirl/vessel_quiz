<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Vessel Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#6b7488;--acc:#e91e63;--ok:#2e9d5b;--bad:#d64045;--line:#e3e6ee;--hi:#14213d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
header h1{font-size:19px;margin:0}
.stats{display:flex;gap:12px;font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
.big{display:block;width:100%;background:var(--hi);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:17px;margin:4px 0 18px}
.big small{display:block;font-weight:400;opacity:.8;font-size:13px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.unit .t{flex:1}
.unit .t b{display:block;font-size:15px}
.unit .t span{font-size:12.5px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.ring{width:38px;text-align:right;font-weight:700;font-size:14px;color:var(--mute)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top .x{font-size:22px;padding:2px 8px;color:var(--mute)}
.prog{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:17px;font-weight:700;margin:4px 2px 8px;min-height:24px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:pan-y pinch-zoom}
.fig svg{display:block;width:100%;height:auto;max-height:58vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 10px;font-size:15px;text-align:left;min-height:54px}
.opt.ok{border-color:var(--ok);background:#e7f6ed}
.opt.bad{border-color:var(--bad);background:#fbe9ea}
.opt .k{display:inline-block;width:22px;height:22px;border-radius:50%;color:#fff;text-align:center;font-weight:700;font-size:13px;line-height:22px;margin-right:6px}
.fb{margin-top:10px;padding:11px 12px;border-radius:12px;font-weight:600;display:none}
.fb.ok{display:block;background:#e7f6ed;color:#1d6b3d}
.fb.bad{display:block;background:#fbe9ea;color:#99232a}
.next{margin-top:10px}
.end{text-align:center;padding:30px 10px}
.end .score{font-size:46px;font-weight:800;margin:8px 0}
.end p{color:var(--mute)}
.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.tabs{display:flex;gap:6px;margin:0 0 6px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.tabs button.on{background:var(--hi);color:#fff;border-color:var(--hi)}
.ans{display:flex;gap:8px;margin-top:10px}
.ans input{flex:1;font:inherit;font-size:17px;padding:13px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--hi)}
.ans button{background:var(--hi);color:#fff;border-radius:12px;padding:0 16px;font-weight:700}
.row2{display:flex;gap:8px;margin-top:8px}.row2 button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:600}
.typed{margin-top:6px;font-size:14px;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin:2px 2px 6px}
.fig svg{max-height:44vh}
.note{font-size:12.5px;color:var(--mute);margin:14px 2px}
.ringbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ringbox .row{display:flex;justify-content:space-between;align-items:baseline}
.ringbox .pc{font-size:30px;font-weight:800}
.ringbox .lbl{color:var(--mute);font-size:13px}
.mbar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 6px;display:flex}
.mbar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.learn{background:#fff7e6;border:1px solid #ffd27a;border-radius:12px;padding:12px;margin-top:10px;font-weight:700;font-size:17px}
.learn small{display:block;font-weight:400;font-size:13px;color:var(--mute);margin-top:3px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.set{display:flex;align-items:center;justify-content:space-between;margin:10px 2px;font-size:14px}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
</style>
</head>

const LETTERS = ["A","B","C","D","E","F"], MARK = ["#e91e63","#1e88e5","#f9a825","#43a047","#8e24aa","#00897b"];

// ---------------- storage

// ---------------- dates (local)
function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }

// ---------------- days off: weekends + Moroccan public holidays (+ your own edits)
// fixed every year (decree 2.77.169 as amended: Yennayer 14 Jan since 2024, Fête de l'Unité 31 Oct since 2026)

  "2028-02-27":"Aïd al-Fitr (estimé)","2028-02-28":"Aïd al-Fitr (estimé)","2028-05-05":"Aïd al-Adha (estimé)","2028-05-06":"Aïd al-Adha (estimé)",

function holidayName(s){ if(S.offAdd && S.offAdd[s]) return S.offAdd[s]; return FIXED[s.slice(5)] || RELIG[s] || "" }
function isOff(s){
  if(S.offRemove && S.offRemove[s]) return false;
  if(S.offAdd && S.offAdd[s]) return true;
  const w = pd(s).getDay(); if(w===0 || w===6) return true;

}
function nextWork(s){ const d = pd(s); while(isOff(ds(d))) d.setDate(d.getDate()+1); return ds(d) }
// due dates always land on working days
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return nextWork(ds(d)) }
function plusWorkDays(n){ const d = new Date(); let k=0; while(k<n){ d.setDate(d.getDate()+1); if(!isOff(ds(d))) k++ } return ds(d) }

// streak counts working days only: a day off never breaks it
function streak(){ const set = new Set(S.days); let n=0; const d=new Date();
  if(!set.has(ds(d))) d.setDate(d.getDate()-1);
  for(let g=0; g<3650; g++){ const k=ds(d); if(set.has(k)){ if(!isOff(k)) n++ } else if(!isOff(k)) break; d.setDate(d.getDate()-1) }
  return n }

// ---------------- cards
const ALL = []; DATA.forEach((u,ui) => u.items.forEach((it,ii) => ALL.push({u, it, ui, ii, tier:u.tier||1,
  k: (u.kind==="var" ? "var:"+u.num+"|"+it.kind+":" : u.num+((u.tier||1)>1?"#"+u.tier:"")+"|") + it.name})));
const st = c => S.c[c.k];                 // undefined = never seen
const stage = c => st(c) ? st(c).s : -1;
const isDue = c => st(c) && st(c).due <= today();
const mastered = c => stage(c) >= MASTER;
function newToday(){ return S.newLog[today()] || 0 }
const REGIONS = [...new Set(DATA.map(u => u.unit))];
const SOLID = 3, UNLOCK = 0.8;   // a tier opens in a region when 80% of the tier below (in that region) is "solid" (survived a 3-day review)
const TIER = {1: ALL.filter(c => c.tier===1), 2: ALL.filter(c => c.tier===2), 3: ALL.filter(c => c.tier===3)};
const TNAME = {1:"Tier 1 · must know", 2:"Tier 2 · vascular imaging", 3:"Tier 3 · interventional"};
const TCOL = {1:"#2e9d5b", 2:"#1e88e5", 3:"#8e24aa"};
const inReg = (r,t) => TIER[t].filter(c => c.u.unit===r);
function below(r, t){ for(let k=t-1; k>=1; k--){ const cs = inReg(r,k); if(cs.length) return {k, cs} } return null }
function solidFrac(cs){ return cs.length ? cs.filter(c => stage(c) >= SOLID).length / cs.length : 1 }
function unlocked(r, t){ if(t===1) return true; if(inReg(r,t).some(c => stage(c) >= 0)) return true;
  const b = below(r,t); return !b || solidFrac(b.cs) >= UNLOCK }
function medal(r){ const t1 = inReg(r,1), t2 = inReg(r,2), t3 = inReg(r,3), all = a => a.every(mastered);
  if(t1.length && all(t1) && all(t2) && all(t3) && (t2.length || t3.length)) return "💎";
  if(t1.length && all(t1) && t2.length && all(t2)) return "🥇";
  if(t1.length && all(t1)) return "🥈";
  if(t1.length && t1.every(c => stage(c) >= 0)) return "🥉";
  return "" }
function counts(list){ let n=0,l=0,r=0,m=0; list.forEach(c => { const s=stage(c); if(s<0) n++; else if(s>=MASTER) m++; else if(s<3) l++; else r++ }); return {n,l,r,m,t:list.length} }

// ---------------- question type follows the stage (recognise -> locate -> fine discrimination)
function qType(c){ const s = stage(c);
  if(c.it.kind==="case") return "case";              // variant set: which pattern is this?
  if(s <= 2) return "name4";                          // early: which vessel is this? 4 choices
  if(s <= 4 && c.u.kind!=="var") return "find";       // middle: find it among 4 lettered vessels
  return (c.u.kind==="var" || Math.random() < .5) ? "name6" : "find";   // late: 6 names from the same figure, or find
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }
function distractors(u, it, k){
  const used = new Set([it.v, it.name]); const out = [];
  let pool = u.items.filter(x => (x.kind||"ves") === (it.kind||"ves"));
  if(it.kind==="case"){ const pat = c_ => u.cases[c_.ci].parts.slice().sort().join(","); const p0 = pat(it); pool = pool.filter(x => x===it || pat(x) !== p0) }
  for(const x of shuffle(pool.slice())){ if(x===it) continue; const vk = x.kind==="case" ? null : x.v;
    if((vk===null || !used.has(vk)) && !used.has(x.name)){ out.push(x); if(vk!==null) used.add(vk); used.add(x.name) } if(out.length===k) break }
  if(out.length<k && it.kind!=="case"){ for(const x of shuffle(DATA.filter(z=>z.unit===u.unit && z!==u && z.kind!=="var").flatMap(z=>z.items))){ if(!used.has(x.name)){ out.push(x); used.add(x.name) } if(out.length===k) break } }

}
function makeQ(c, forceType){
  let type = forceType || qType(c);
  if(c.it.kind==="case"){ const n = Math.min(3, c.u.items.filter(x=>x.kind==="case").length-1); return {c, type:"case", opts: shuffle([c.it, ...distractors(c.u, c.it, n)])} }
  if(type==="find"){
    const ds_ = []; const used = new Set([c.it.v]);
    for(const d of shuffle(c.u.items.filter(x=>x!==c.it))){ if(!used.has(d.v)){ ds_.push(d); used.add(d.v) } if(ds_.length===3) break }
    if(ds_.length===3) return {c, type, opts: shuffle([c.it, ...ds_])};
    type = "name4";
  }
  const k = type==="name6" ? 5 : 3;
  return {c, type, opts: shuffle([c.it, ...distractors(c.u, c.it, k)])};
}

// ---------------- building a session
function dueCards(){ return ALL.filter(isDue).sort((a,b) => st(a).due.localeCompare(st(b).due) || st(a).s - st(b).s) }
function aheadCards(){ // what's waiting for the next 2 working days, soonest first
  const lim = plusWorkDays(2);
  return ALL.filter(c => st(c) && st(c).due <= lim).sort((a,b) => st(a).due.localeCompare(st(b).due) || st(a).s - st(b).s) }
function nextNew(n){ // tier 1 first (study order); tier 2 once all of tier 1 is introduced; tier 3 once all of tier 2 is
  for(const t of [1,2,3]){
    if(t>1 && TIER[t-1].some(c => stage(c) < 0)) return [];
    const fresh = TIER[t].filter(c => stage(c) < 0 && unlocked(c.u.unit, t));
    if(fresh.length) return fresh.slice(0, n);
  }
  return [];
}
function buildSession(opt){
  opt = opt || {};
  // one session = everything due + all of today's new vessels (the limit counts vessels, not screens)
  const src = opt.ahead ? aheadCards() : dueCards();
  const due = opt.ahead ? src.slice(0, 30) : src;
  const room = (offToday() && !opt.learnNew) ? 0 : Math.max(0, S.newPerDay - newToday());
  const fresh = nextNew(room);
  // questions only: reviews and new vessels mixed (new ones spread through the session)
  const Q = shuffle(due).map(c => ({c, type: c.it.kind==="case" ? "case" : "type"}));
  fresh.forEach((c,i) => Q.splice(Math.min(Q.length, Math.round((i+1) * (Q.length+1) / (fresh.length+1))), 0, {c, type: c.it.kind==="case" ? "case" : "type", first:true}));
  return Q;
}
function practiceSession(u){ // free practice of one unit — does not move the schedule
  const pool = shuffle(ALL.filter(c => c.u===u)).slice(0, ROUND);
  return pool.map(c => ({c, type: c.it.kind==="case" ? "case" : "type", practice:true}));
}

// ---------------- svg
function tint(c, k){ const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16); return "rgb("+[r,g,b].map(v=>Math.round(v+(255-v)*k)).join(",")+")" }
const P = pts => pts.map(p => p[0]+","+p[1]).join(" ");
function midpoint(pts){ let L=0; const seg=[]; for(let i=0;i<pts.length-1;i++){ const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); seg.push(l); L+=l }

function zoomVB(u, vi){ // frame around the highlighted vessel: at least half the figure, so you keep your bearings
  const p = u.ves[vi].p, xs = p.map(q=>q[0]), ys = p.map(q=>q[1]);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const [X,Y,W,H] = u.vb, w = Math.min(W, Math.max(W*0.55, (x1-x0)*2.2)), hh = Math.min(H, Math.max(H*0.45, (y1-y0)*2.2, w*0.9));

function figSVG(u, marks, ci, zoom){

  let h = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(" ")}" font-family="system-ui,sans-serif"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fff"/><g opacity=".9">${u.ctx}</g>`;

    const idx = [...u.trunk, ...u.cases[ci||0].parts];
    idx.forEach(i => { const v = u.ves[i]; h += `<polyline points="${P(v.p)}" fill="none" stroke="#fff" stroke-width="${v.w+4*s}" stroke-linecap="round" stroke-linejoin="round"/>` });
    idx.forEach(i => { const v = u.ves[i]; h += `<polyline points="${P(v.p)}" fill="none" stroke="${v.c}" stroke-width="${v.w}" stroke-linecap="round" stroke-linejoin="round"/>` });
  } else
  u.ves.forEach(v => { if(v.x) return; h += `<polyline points="${P(v.p)}" fill="none" stroke="${tint(v.c,.55)}" stroke-width="${v.w}" stroke-linecap="round" stroke-linejoin="round"${v.d?' stroke-dasharray="6 5"':''}/>` });
  marks.forEach(m => { const v = u.ves[m.v], w = Math.max(v.w+5, 8*s);
    h += `<polyline points="${P(v.p)}" fill="none" stroke="#fff" stroke-width="${w+6*s}" stroke-linecap="round" stroke-linejoin="round"/>`;
    h += `<polyline class="${m.letter?'':'pulse'}" points="${P(v.p)}" fill="none" stroke="${m.col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` });
  marks.forEach(m => { if(m.letter) return; const p = u.ves[m.v].p; let L=0; for(let i=0;i<p.length-1;i++) L+=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);
    if(L < 70*s){ const c = midpoint(p); h += `<circle class="pulse" cx="${c[0]}" cy="${c[1]}" r="${26*s}" fill="none" stroke="${m.col}" stroke-width="${4*s}"/>` } });
  marks.forEach(m => { if(!m.letter) return; const c = midpoint(u.ves[m.v].p), r = 15*s;
    h += `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${m.col}" stroke="#fff" stroke-width="${3*s}"/><text x="${c[0]}" y="${c[1]+r*0.38}" font-size="${r*1.1}" font-weight="700" fill="#fff" text-anchor="middle">${m.letter}</text>` });
  return h + "</svg>";
}

// ---------------- home
const app = document.getElementById("app");
function tierBox(list, name, sub, locked){
  const C = counts(list), pc = Math.round(100*C.m/C.t);
  return `<div class="ringbox"${locked?' style="opacity:.6"':''}><div class="row"><span><span class="pc">${pc}%</span> <b style="font-size:15px">${name}</b></span><span class="lbl">${C.m}/${C.t} mastered</span></div>
    <div class="mbar"><i style="width:${100*C.m/C.t}%;background:#2e9d5b"></i><i style="width:${100*C.r/C.t}%;background:#8bc34a"></i><i style="width:${100*C.l/C.t}%;background:#ffb300"></i></div>
    <div class="lbl">${sub}</div></div>` }
function home(){
  const C = counts(TIER[1]), due = dueCards().length, nleft = Math.max(0, S.newPerDay - newToday());
  const daysIntro = Math.ceil(C.n / S.newPerDay);
  const lastIntro = plusWorkDays(Math.max(0, daysIntro-1));
  const finish = (() => { const d = pd(lastIntro); d.setDate(d.getDate()+1+3+7+16+1); return nextWork(ds(d)) })();
  const regs = t => REGIONS.filter(r => inReg(r,t).length), nUnl = t => regs(t).filter(r => unlocked(r,t)).length;
  let h = `<header><h1>Vessel Quiz</h1><div class="stats"><span class="pill">🔥 ${streak()}</span><span class="pill">⭐ ${S.xp}</span></div></header>`;
  h += tierBox(TIER[1], TNAME[1], C.n ? `Trunks and first-order branches. At ${S.newPerDay} new a study day, 100% around <b>${fmt(finish)}</b>.` : (C.m===C.t ? "Tier 1 complete 🥈 — keep clearing reviews to hold it." : "All introduced — clear the reviews to finish."), false);
  h += tierBox(TIER[2], TNAME[2], `Second-order branches + the variants you meet on CTA. ${nUnl(2)}/${regs(2).length} regions unlocked — opens per region at 80% solid tier 1; new cards start once all of tier 1 is introduced.`, nUnl(2)===0);
  h += tierBox(TIER[3], TNAME[3], `Deep branches, dangerous anastomoses, cord supply, embolisation variants. ${nUnl(3)}/${regs(3).length} regions unlocked — opens per region at 80% solid tier 2; new cards start once all of tier 2 is introduced.`, nUnl(3)===0);
  h += `<div class="legend" style="margin:-4px 2px 12px"><span><b style="background:#2e9d5b"></b>mastered</span><span><b style="background:#8bc34a"></b>reviewing</span><span><b style="background:#ffb300"></b>learning</span><span><b style="background:#e3e6ee"></b>not seen</span><span>🥉 tier 1 seen · 🥈 tier 1 mastered · 🥇 tiers 1+2 · 💎 all three</span></div>`;
  const off = offToday();
  const availN = nextNew(1e6).length;   // new vessels currently allowed (tier 1, or unlocked tier 2)
  const todo = off ? 0 : Math.min(due, ROUND) + Math.min(nleft, Math.max(0, ROUND - Math.min(due,ROUND)), availN);
  const ahead = aheadCards().length;
  if(off){
    const nm = holidayName(today()) || (pd(today()).getDay()%6===0 ? "Weekend" : "Day off");
    h += `<div class="ringbox" style="background:#eef7ff;border-color:#cfe3fb"><b>🌴 Day off — ${nm}</b><div class="lbl">Nothing is due. Next study day: ${fmt(nextWork(ds(new Date(Date.now()+864e5))))}.</div></div>`;
    h += ahead ? `<button class="big" id="ahead" style="background:#1e88e5">Review ahead (optional)<small>${ahead} card${ahead===1?"":"s"} coming up in the next 2 study days${due?` · ${due} overdue`:""}</small></button>` : "";
    h += availN ? `<button class="big" id="newanyway" style="background:#fff;color:var(--ink);border:1px solid var(--line)">Learn new ones anyway<small>uses today's ${S.newPerDay} new — they'll come back on study days</small></button>` : "";
  } else {
    h += todo ? `<button class="big" id="go">Study now<small>${due} due for review · ${Math.min(nleft, availN)} new left today</small></button>`
              : `<button class="big" id="go" style="background:#2e9d5b">All done for today ✓<small>Next reviews on the next study day. Extra practice below doesn't change the schedule.</small></button>`;
    if(!todo && ahead) h += `<button class="big" id="ahead" style="background:#1e88e5">Review ahead (optional)<small>${ahead} card${ahead===1?"":"s"} coming up in the next 2 study days</small></button>`;
  }
  h += `<div class="set"><span>New vessels per study day</span><select id="npd">${[5,10,15,20,30].map(n=>`<option ${n===S.newPerDay?"selected":""}>${n}</option>`).join("")}</select></div>`;
  const groups = {}; DATA.forEach(u => (groups[u.unit] = groups[u.unit]||[]).push(u));
  for(const [name, list] of Object.entries(groups)){
    const md = medal(name);
    h += `<h2>${md?md+" ":""}${name}</h2>`;
    list.forEach(u => { const t = u.tier||1, cs = ALL.filter(c=>c.u===u), k = counts(cs), m = Math.round(100*k.m/k.t), lock = !unlocked(name, t);
      const what = u.kind==="var" ? `${k.t} cards · variants` : `${k.t} vessels`, tag = t>1 ? `<span class="tag" style="background:${TCOL[t]}">T${t}</span>` : "";
      if(lock){ const b = below(name,t), sf = Math.round(100*solidFrac(b.cs));
        h += `<div class="unit" style="opacity:.55"><div class="t"><b>🔒 ${u.title}${tag}</b><span>${u.num} · ${what} · opens at 80% solid tier ${b.k} here (now ${sf}%)</span><div class="bar"><i style="width:${Math.min(100,sf/0.8)}%;background:#6b7488"></i></div></div></div>`; return }
      h += `<button class="unit" data-i="${DATA.indexOf(u)}"><div class="t"><b>${u.title}${tag}</b><span>${u.num} · ${what}${k.n===k.t?" · not started":""}</span>
      <div class="bar" style="display:flex"><i style="width:${100*k.m/k.t}%"></i><i style="width:${100*k.r/k.t}%;background:#8bc34a"></i><i style="width:${100*k.l/k.t}%;background:#ffb300"></i></div></div><div class="ring">${m}%</div></button>` });
  }
  // days-off editor
  const up = []; { const d = new Date(); for(let i=0;i<400;i++){ const k = ds(d); const w = pd(k).getDay(); if((w!==0 && w!==6) && (holidayName(k) || S.offRemove[k])) up.push(k); d.setDate(d.getDate()+1) } }
  h += `<details style="margin:14px 2px"><summary style="font-weight:700">Days off (weekends + holidays)</summary>
    <p class="note" style="margin:6px 0">Weekends are always off. Religious holidays are estimates — fix them here when the dates are announced. Tap a date to switch it on/off.</p>
    ${up.slice(0,30).map(k => `<div class="set" style="margin:4px 0"><span>${fmt(k)} · ${holidayName(k)||"(holiday removed)"}</span><button class="pill" data-tog="${k}">${isOff(k)?"off ✓":"study day"}</button></div>`).join("")}
    <div class="set"><input type="date" id="addd" style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px"><button class="pill" id="addb">Add day off</button></div></details>`;
  h += `<p class="note">Progression: tier 1 (must know) first, region by region. A region's tier 2 (vascular imaging) opens once 80% of its tier-1 cards are solid; its tier 3 (interventional) once 80% of its tier-2 cards are solid. New cards of a tier start only after the whole tier below has been introduced. Variant sets give two kinds of cards: “which pattern is this?” on an unlabelled case, and “which vessel?” on the variant drawing. How it works: every card is a question — type the name of the highlighted vessel (or, on variant sets, the variant you see). A new vessel's first miss doesn't count against you; it comes back a few cards later. Each right answer pushes the next review further out (1 → 3 → 7 → 16 → 35 days); reviews never land on weekends or holidays — they move to the next study day. On days off nothing is due, but you can review ahead. A wrong answer brings it back the next study day and repeats it in the same session. The checker accepts typos, abbreviations (ICA, SMA, GDA…), a./artery, R/right and any word order, but not the wrong side, sup/inf, replaced/accessory or a wrong origin; if it rejects a correct answer, tap “I was right”. “Mastered” = still right after a 16-day gap. Tapping a unit gives extra practice that doesn't move the schedule. Progress stays in this browser on this device.</p>`;
  h += `<button class="big" id="rst" style="background:#fff;color:#c62828;border:1px solid var(--line);margin-top:14px">Reset all progress<small>keeps your days off and new-per-day setting</small></button>
    <p class="note" style="text-align:center">v3</p>`;
  app.innerHTML = h;
  document.getElementById("rst").onclick = () => { if(confirm("Erase ALL vessel progress on this phone?") && confirm("Really? This cannot be undone.")){ S.c = {}; S.xp = 0; S.days = []; S.newLog = {}; save(); home() } };
  const g = document.getElementById("go"); if(g) g.onclick = () => { if(todo) run(buildSession()) };
  const a = document.getElementById("ahead"); if(a) a.onclick = () => run(buildSession({ahead:true}));
  const nw = document.getElementById("newanyway"); if(nw) nw.onclick = () => run(buildSession({learnNew:true}));
  app.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { const k = b.dataset.tog;
    if(isOff(k)){ delete S.offAdd[k]; if(FIXED[k.slice(5)] || RELIG[k]) S.offRemove[k] = 1 } else { delete S.offRemove[k]; if(!(FIXED[k.slice(5)] || RELIG[k])) S.offAdd[k] = "Day off" }
    save(); home() });
  document.getElementById("addb").onclick = () => { const v = document.getElementById("addd").value; if(!v) return; delete S.offRemove[v]; S.offAdd[v] = "Day off (added)"; save(); home() };
  document.getElementById("npd").onchange = e => { S.newPerDay = +e.target.value; save(); home() };
  app.querySelectorAll(".unit").forEach(b => b.onclick = () => run(practiceSession(DATA[+b.dataset.i])));
}

// ---------------- session
let Q, qi, score, asked, before;
function snap(){ return REGIONS.map(r => [2,3].map(t => inReg(r,t).length && unlocked(r,t) ? "U"+t : "").join("") + medal(r)) }
function run(q){ Q = q; qi = 0; score = 0; asked = 0; before = snap(); if(!Q.length) return home(); ask() }
function bar(){ return `<div class="top"><button class="x" id="quit">✕</button><div class="prog"><i style="width:${100*qi/Q.length}%"></i></div></div>` }
function varMarks(u, ci, col){ const cs = u.cases[ci]; return cs.parts.filter(i => !u.usual.includes(i) && !u.trunk.includes(i)).map(i => ({v:i, col})) }
function ask(){
  const q = Q[qi], c = q.c, isCase = q.type==="case";
  const marks = isCase ? [] : [{v:c.it.v, col:"#e91e63"}];
  const tags = (q.first && stage(c) < 0 ? ' <span class="tag" style="background:#ffb300">NEW</span>' : '') + (c.tier>1?` <span class="tag" style="background:${TCOL[c.tier]}">T${c.tier}</span>`:"") + (q.practice?' <span class="tag" style="background:#6b7488">PRACTICE</span>':'');
  app.innerHTML = bar() + `<div class="q">${isCase ? "Which pattern is this?" : "Name the highlighted vessel"}${tags}</div>
    ${isCase ? `<div class="hint">Type the variant vessel(s) you see — e.g. a replaced or aberrant vessel and where it comes from — or “normal”.</div>` : ""}
    <div class="fig">${figSVG(c.u, marks, c.it.ci, isCase ? null : c.it.v)}</div>
    <form class="ans" id="af"><input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${isCase ? "variant vessel(s), or normal" : "type the name"}"><button>Check</button></form>
    <div class="row2"><button id="dk">Don't know</button></div><div class="fb" id="fb"></div>`;
  window.scrollTo(0,0);
  document.getElementById("quit").onclick = home;
  const inp = document.getElementById("inp");
  document.getElementById("af").onsubmit = e => { e.preventDefault(); if(inp.value.trim()) check(inp.value) };
  document.getElementById("dk").onclick = () => check("");
  setTimeout(() => { try{ inp.focus() }catch(e){} }, 50);
}
function check(typed){
  const q = Q[qi], c = q.c;
  const right = typed ? (q.type==="case" ? MX.judgeCase(typed, c.u.cases[c.it.ci]) : MX.judge(typed, c.it.full || c.it.name)) : false;
  q.typed = typed; q.right = right;
  document.getElementById("af").remove(); document.getElementById("dk").parentNode.remove();
  if(q.type==="case") app.querySelector(".fig").innerHTML = figSVG(c.u, varMarks(c.u, c.it.ci, "#2e9d5b"), c.it.ci);
  else app.querySelector(".fig").innerHTML = figSVG(c.u, [{v:c.it.v, col: right ? "#2e9d5b" : "#e91e63"}], null, c.it.v);
  const cs = q.type==="case" ? c.u.cases[c.it.ci] : null;
  const nm = q.type==="case" ? cs.ans + (cs.key && cs.key[0] !== "Normal" ? ` — variant: ${cs.key.join(" + ")}` : "") : (c.it.full || c.it.name);
  const fb = document.getElementById("fb");
  fb.className = "fb " + (right ? "ok" : "bad");
  fb.innerHTML = (right ? "Right — " : (typed ? "Not quite. Answer: " : "Answer: ")) + nm + (typed && !right ? `<div class="typed">You typed: ${typed.replace(/</g,"&lt;")}</div>` : "");
  if(!right && navigator.vibrate) try{ navigator.vibrate(120) }catch(e){}
  const row = document.createElement("div"); row.className = "row2";
  const nx = document.createElement("button"); nx.className = "big next"; nx.style.margin = "10px 0 0"; nx.textContent = qi+1 < Q.length ? "Next" : "See result";
  nx.onclick = () => { commit(q); nextQ() };
  app.appendChild(nx);
  if(!right && typed){
    const ov = document.createElement("button"); ov.textContent = "I was right — count it";
    ov.onclick = () => { q.right = true; commit(q); nextQ() };
    row.appendChild(ov); app.appendChild(row);
  }
  nx.focus();
}
function commit(q){ // the result only counts when you move on (so "I was right" can correct it)
  const c = q.c, right = q.right;
  asked++; if(right) score++;
  if(!q.practice){
    const wasNew = !S.c[c.k];
    const s = S.c[c.k] || {s:0, due:today(), lapses:0};
    if(wasNew) S.newLog[today()] = newToday()+1;
    // s = rung on the ladder INTERVAL; rl = "relearning": a miss puts in a next-day check, then the ladder resumes at s
    if(q.retry){ }                                                       // repeat of a miss in the same session: already due tomorrow
    else if(right && wasNew){ s.s = 3; s.due = addDays(7) }              // known on first sight: skip 1 and 3 days
    else if(right && s.rl){ delete s.rl; s.due = addDays(INTERVAL[s.s]) } // passed the next-day check: resume 2 rungs down
    else if(right){ s.s = Math.min(INTERVAL.length-1, Math.max(2, s.s+1)); s.due = addDays(INTERVAL[s.s]) }
    else if(wasNew){ s.s = 2; s.rl = 1; s.due = addDays(1) }             // new and missed: tomorrow, then 3, 7, 16...
    else if(s.rl){ s.s = Math.max(1, s.s-1); s.due = addDays(1) }        // missed the next-day check too
    else { s.lapses = (s.lapses||0)+1; s.s = Math.max(1, s.s-2); s.rl = 1; s.due = addDays(1) }  // lapse: tomorrow, then 2 rungs down
    S.c[c.k] = s;
    if(!right && (q.n||0) < 2) Q.splice(Math.min(Q.length, qi+4), 0, {c, type:q.type, retry:true, n:(q.n||0)+1});
  }
  if(right) S.xp += q.practice ? 5 : 10;
  if(!S.days.includes(today())) S.days.push(today());
  save();
}
function nextQ(){ qi++; qi < Q.length ? ask() : end() }
function end(){
  const due = dueCards().length, C = counts(TIER[1]), after = snap();
  const news = REGIONS.map((r,i) => { const b = before[i], a = after[i]; const out = [];
    for(const t of [2,3]) if(a.includes("U"+t) && !b.includes("U"+t)) out.push(`🔓 Tier ${t} unlocked: <b>${r}</b>`);
    for(const m of ["🥉","🥈","🥇","💎"]) if(a.includes(m) && !b.includes(m)) out.push(`${m} <b>${r}</b> — ${({"🥉":"all tier-1 cards seen","🥈":"tier 1 mastered","🥇":"tiers 1 and 2 mastered","💎":"all three tiers mastered"})[m]}`);
    return out.join("<br>") }).filter(Boolean);
  app.innerHTML = `<div class="end"><div style="font-size:40px">${news.length?"🏆":asked && score/asked>=.8?"🎉":"💪"}</div><div class="score">${score}/${asked}</div>
  ${news.length?`<div class="ringbox" style="text-align:left">${news.join("<br>")}</div>`:""}
  <p>🔥 ${streak()}-day streak · tier 1 ${Math.round(100*C.m/C.t)}% mastered</p>
  ${!offToday() && (due || (S.newPerDay-newToday()>0 && C.n)) ? `<button class="big" id="again">Another 10<small>${due} still due</small></button>` : `<p><b>Done for today.</b> Next reviews on ${fmt(nextWork(ds(new Date(Date.now()+864e5))))}.</p>`}
  <button class="big" style="background:#fff;color:var(--ink);border:1px solid var(--line)" id="h">Home</button></div>`;
  const a = document.getElementById("again"); if(a) a.onclick = () => run(buildSession());
  document.getElementById("h").onclick = home;
}
home();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
